aid: kayak
name: Kayak
description: >-
  KAYAK is a free travel metasearch engine that searches hundreds of travel
  sites at once so travelers can compare and find the lowest available prices on
  flights, hotels, rental cars, and vacation packages, with an extensive
  filtering system for narrowing results. Founded in 2004 and part of Booking
  Holdings, KAYAK operates a family of global travel brands (including momondo,
  Cheapflights, HotelsCombined, SWOODOO, checkfelix and Mundi) across 60+
  international sites in 25+ languages. Beyond consumer metasearch it offers
  KAYAK for Business, a Flight Tracker, an Explore destination-discovery tool,
  and KAYAK AI trip-planning. KAYAK is a metasearch and price-comparison engine
  rather than an online travel agency — bookings are completed with the airline,
  hotel, car-rental company, or travel agency. This profile documents KAYAK's
  public discovery, AI, and security surface; KAYAK does not currently operate a
  public self-serve developer API program.
